syntax = "proto3";

package hello;

service Bench {
    // Unary RPCs
    rpc SmallPayload (Payload) returns (Payload);
    rpc LargePayload (Payload) returns (Payload);

    // Streaming RPCs
    rpc ServerStream (StreamRequest) returns (stream Payload);
    rpc ClientStream (stream Payload) returns (StreamResponse);
    rpc BidiStream (stream Payload) returns (stream Payload);
}

message Payload {
    bytes data = 1;
}

message StreamRequest {
    int32 chunks = 1;
    int32 chunk_size = 2;
}

message StreamResponse {
    int64 total_bytes = 1;
    int32 total_chunks = 2;
}
